name: Validate PIIK site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate data, generated pages and links
        run: |
          python3 scripts/build-site.py --check
          python3 scripts/render-source-review.py --check
          python3 scripts/check-links.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check app.js
          node --check editorial.js
          node tests/integration-preparation.cjs
      - name: Install browser test tools
        run: |
          tools_dir="$RUNNER_TEMP/piik-tools"
          npm install --prefix "$tools_dir" --no-audit --no-fund --save-exact playwright@1.62.1 axe-core@4.11.0
          "$tools_dir/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$tools_dir/node_modules" >> "$GITHUB_ENV"
          echo "PIIK_CHROMIUM=$(node -p "require('$tools_dir/node_modules/playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
          echo "PIIK_AXE_PATH=$tools_dir/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: Exercise public site
        env:
          PIIK_TEST_OUTPUT: ${{ runner.temp }}/piik-test-output
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 > "$RUNNER_TEMP/piik-server.log" 2>&1 &
          trap 'kill "$!"' EXIT
          curl --retry 5 --retry-connrefused --fail --silent --show-error http://127.0.0.1:3000/ -o /dev/null
          node tests/site.cjs
          node tests/imagery.cjs
          node tests/phase2.cjs
          node tests/review-links.cjs
          node tests/official-hub.cjs
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piik-browser-checks
          path: |
            ${{ runner.temp }}/piik-test-output
            ${{ runner.temp }}/piik-server.log
          if-no-files-found: ignore

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the exact release on the public domain
        run: |
          base="https://piikkenya.com"
          response="$RUNNER_TEMP/piik-production.html"
          for attempt in {1..24}; do
            if curl --proto '=https' --proto-redir '=https' --connect-timeout 5 --max-time 10 \
                --fail --silent --show-error --location "$base/" -o "$response" &&
                cmp --silent index.html "$response"; then
              for path in verify.html directory.html weekly.html watch.html knowledge.html sitemap.xml feed.xml; do
                curl --proto '=https' --proto-redir '=https' --connect-timeout 5 --max-time 10 \
                  --fail --silent --show-error --location "$base/$path" -o "$response"
                cmp "$path" "$response"
                echo "Verified $base/$path"
              done
              echo "Verified homepage and service pages from $GITHUB_SHA"
              exit 0
            fi
            echo "Deployment or CDN propagation pending (attempt $attempt)"
            sleep 10
          done
          echo "::error::The public homepage did not match the release"
          exit 1
