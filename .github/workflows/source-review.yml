name: Review public sources

on:
  push:
    branches: [main]
    paths:
      - 'data/monitoring.json'
      - 'data/sources.json'
      - 'scripts/monitor-sources.py'
      - '.github/workflows/source-review.yml'
  schedule:
    - cron: '25 6 * * *'
    - cron: '40 6 * * 6'
    - cron: '55 6 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Collection or review mode
        type: choice
        options: [daily, weekly, monthly]
        default: weekly

permissions:
  contents: read

concurrency:
  group: piik-source-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore collection state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/piik-baseline/state.json
          key: piik-baseline-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: piik-baseline-v2-
      - name: Collect leads and check source health
        id: collect
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          mode="${REQUESTED_MODE:-daily}"
          case "$EVENT_SCHEDULE" in
            '40 6 * * 6') mode=weekly ;;
            '55 6 1 * *') mode=monthly ;;
          esac
          status=0
          python3 scripts/monitor-sources.py --mode "$mode" \
            --baseline "$RUNNER_TEMP/piik-baseline/state.json" \
            --output "$RUNNER_TEMP/piik-source-review" || status=$?
          if test -f "$RUNNER_TEMP/piik-source-review/review-queue.json"; then
            echo "state_written=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Save collection state even after partial failures
        if: ${{ !cancelled() && steps.collect.outputs.state_written == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/piik-baseline/state.json
          key: piik-baseline-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload editorial leads and source health
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piik-source-review
          path: ${{ runner.temp }}/piik-source-review
          retention-days: 10
          if-no-files-found: error
