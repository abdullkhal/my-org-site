name: Review public sources

on:
  schedule:
    - cron: '25 6 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piik-source-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore source fingerprints
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/piik-baseline/fingerprints.json
          key: piik-source-review-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: piik-source-review-v1-
      - name: Check sources and write editorial queue
        run: |
          python3 scripts/monitor-sources.py \
            --baseline "$RUNNER_TEMP/piik-baseline/fingerprints.json" \
            --output "$RUNNER_TEMP/piik-source-review"
      - name: Save successful fingerprints
        if: success()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/piik-baseline/fingerprints.json
          key: piik-source-review-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the editorial queue and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piik-source-review
          path: ${{ runner.temp }}/piik-source-review
          if-no-files-found: warn
